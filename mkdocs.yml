site_name: ⛶ Path Header Scanner
site_description: Developer utility for inserting, validating, and updating file path headers across source code and documentation files.
# site_url: https://mydomainsite.com
site_url: http://localhost:8001
site_author: Devalltect00

repo_name: path-header-scanner
repo_url: https://github.com/devalltect00/Path-Header-Scanner

#gitlab
# edit_uri: -/edit/main/backend/docs
#github
# edit_uri: edit/main/docs/

theme:
    name: material
    language: en
    palette:
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: purple
          accent: deep purple
          toggle:
              icon: material/weather-night
              name: Switch to dark mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: teal
          accent: lime
          toggle:
              icon: material/weather-sunny
              name: Switch to light mode
    font:
        text: Roboto
        code: Fira Code
    icon:
        logo: fontawesome/solid/d
    features:
        - navigation.instant
        - navigation.tracking
        - navigation.tabs
        - navigation.sections
        - navigation.expand
        - navigation.footer
        - navigation.top
        - toc.integrate
        - header.autohide
        - content.code.annotate
        - content.code.copy
        - content.tabs.link
        - search.suggest
        - search.highlight

markdown_extensions:
    - admonition
    - attr_list
    - def_list
    - footnotes
    - codehilite
    - md_in_html
    - tables

    - toc:
          permalink: true

    - pymdownx.keys
    - pymdownx.tasklist
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.superfences
    - pymdownx.details
    - pymdownx.tabbed:
          alternate_style: true
    - pymdownx.highlight:
          anchor_linenums: true
          line_spans: __span
          pygments_lang_class: true
    # - pymdownx.emoji
    # Local (run well)
    - pymdownx.emoji:
          emoji_index: !!python/name:material.extensions.emoji.twemoji
          emoji_generator: !!python/name:material.extensions.emoji.to_svg
              # (wwhen build for production)
              # - pymdownx.emoji:
              # emoji_index: !!python/name:material.extensions.emoji.twemoji
              # emoji_generator: !!python/name:material.extensions.emoji.to_svg


plugins:
    - search:
          lang: en

docs_dir: docs
site_dir: site

