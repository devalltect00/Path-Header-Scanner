# =========================================================
# 🚀 Production Docker Image
# =========================================================
#
# Build production images after the package gate validates a protected,
# annotated release tag. Stable releases update the matching major, minor,
# and `latest` aliases; prereleases publish only their exact version.
#
# =========================================================

docker:prod:
  stage: docker

  image: docker:27

  services:
    - docker:27-dind

  variables:
    DOCKER_TLS_CERTDIR: "/certs"

  needs:
    - job: package:build
      artifacts: true

  before_script:
    - docker version

  script:
    - |
      STABLE_TAG_REGEX='^v[0-9]+\.[0-9]+\.[0-9]+$'
      TAG="$CI_COMMIT_TAG"

      if [ -z "$PACKAGE_VERSION" ]; then
        echo "The package gate did not provide a canonical PEP 440 version." >&2
        exit 1
      fi

      IMAGE_TAG="$(printf '%s' "$TAG" | tr '+' '-')"
      VERSION_CORE="${TAG#v}"
      VERSION_CORE="${VERSION_CORE%%+*}"
      MAJOR="${VERSION_CORE%%.*}"
      MINOR_AND_REST="${VERSION_CORE#*.}"
      MINOR="${MINOR_AND_REST%%.*}"

      echo "$CI_REGISTRY_PASSWORD" |
        docker login "$CI_REGISTRY" \
          -u "$CI_REGISTRY_USER" \
          --password-stdin

      docker build \
        --build-arg PHS_BUILD_VERSION="$PACKAGE_VERSION" \
        -f Dockerfile \
        --target production \
        --label org.opencontainers.image.title="$CI_PROJECT_NAME" \
        --label org.opencontainers.image.description="Source path-header validation and repair automation" \
        --label org.opencontainers.image.url="$CI_PROJECT_URL" \
        --label org.opencontainers.image.source="$CI_PROJECT_URL" \
        --label org.opencontainers.image.version="$TAG" \
        --label org.opencontainers.image.revision="$CI_COMMIT_SHA" \
        --label org.opencontainers.image.created="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" \
        .

      docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"

      if printf '%s' "$TAG" | grep -Eq "$STABLE_TAG_REGEX"; then
        docker tag "$CI_REGISTRY_IMAGE:$IMAGE_TAG" "$CI_REGISTRY_IMAGE:v$MAJOR.$MINOR"
        docker tag "$CI_REGISTRY_IMAGE:$IMAGE_TAG" "$CI_REGISTRY_IMAGE:v$MAJOR"
        docker tag "$CI_REGISTRY_IMAGE:$IMAGE_TAG" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:v$MAJOR.$MINOR"
        docker push "$CI_REGISTRY_IMAGE:v$MAJOR"
        docker push "$CI_REGISTRY_IMAGE:latest"
      else
        echo "Prerelease tag detected; stable aliases will not be updated."
      fi

  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
